packages:
  - .

allowBuilds:
  es5-ext: true
  esbuild: true
  sharp: true

minimumReleaseAge: 0

onlyBuiltDependencies:
  - esbuild
  - sharp
  - es5-ext

overrides:
  '@melt-ui/svelte': ^0.86.6
  bits-ui: ^2.17.3
  'cookie@<2': ^1.0.2
  valibot: ^1.3.1
  esbuild: ^0.28.0
  vite@*: 'catalog:'
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.6.0
  vite-plus: 1.6.0
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: '*'
minimumReleaseAgeExclude:
  - vite-plus
  - '@voidzero-dev/*'
  - oxlint
  - '@oxlint/*'
  - oxlint-tsgolint
  - '@oxlint-tsgolint/*'
  - oxfmt
  - '@oxfmt/*'
  - vitest
  - '@vitest/*'
